# keymap-drawer settings for this project, modeled directly on
# urob/zmk-config's draw/config.yaml (https://github.com/urob/zmk-config)
# rather than keymap-drawer's own defaults - see `just draw` in the
# justfile for how this gets used.
#
# Physical layout isn't set here since keymap-drawer has no field for it
# in this config file; it's passed as --ortho-layout on the `keymap
# draw` command line instead. urob's own config draws against a real
# QMK-cataloged board (`-k ferris/sweep`), which is not an option here -
# there's no catalog entry for this custom board - so an ortho layout
# (3 rows x 5 columns per hand + 2 thumbs per hand, matching this
# project's own 0-33 position numbering) stands in for it. Unlike the
# previous version of this file, key_w/key_h/outer_pad/etc. are left at
# (or set to) the same values urob uses rather than inflated - the
# "spacious, uncluttered" look in base.svg comes from restrained
# typography and a sparse raw_binding_map, not from bigger keys.
parse_config:
  # Trimmed WAY down from a previous, denser version of this file: only
  # entries needed to replace a raw "&behavior_name" that keymap-drawer
  # can't resolve on its own. One key = one short label, no invented
  # secondary "badge" tags (RF/cmd/Cleanse/Swap etc.) - if a key needs
  # more explanation than its own face can carry, that belongs in prose
  # (README/comments), not jammed into the SVG. Native ZMK behaviors
  # (&mo/&lt/&tog/&kp, hold-taps including HRM) already render correctly
  # with no map entry at all and aren't listed here.
  raw_binding_map:
    # Rapid-fire (Gaming/MUTIL, all 14 targets): just the output key,
    # nothing else - which keys rapid-fire is documented in prose
    # elsewhere, not on every keycap.
    "&rf Q": Q
    "&rf W": W
    "&rf E": E
    "&rf U": U
    "&rf G": G
    "&rf H": H
    "&rf X": X
    "&rf C": C
    "&rf B": B
    "&rf N": N
    "&rf N1": "1"
    "&rf N2": "2"
    "&rf N3": "3"
    "&rf APOS": "'"
    "&smart_fn": FN
    "&smart_mouse": Mouse
    "&num_dance": Num
    "&gcmd_down": Down
    "&gcmd_trigger A N9": A
    "&cleanse_alt": Alt/F8
    "&ctrl_both": L+R Ctrl
    "&swapper": Alt+Tab
    # Space chatter-guard - a test behavior with no long-term intent to
    # keep it (see project notes), so just enough of a label that
    # "&cguard" doesn't show up raw; not worth more than that.
    "&cguard SPACE": SPACE
    "&shift_repeat": Shift
    # Generic ZMK behaviors, mapped the same way urob's own config maps
    # them (same behaviors/params, not project-specific).
    "&sys_reset": Reset
    "&bootloader": Boot
    "&caps_word": Caps Word
    "&mkp LCLK": Left Click
    "&mkp RCLK": Right Click
    "&mkp MCLK": Middle Click
    "&mmv MOVE_UP": Mouse ↑
    "&mmv MOVE_DOWN": Mouse ↓
    "&mmv MOVE_LEFT": Mouse ←
    "&mmv MOVE_RIGHT": Mouse →
    "&msc SCRL_UP": Scroll ↑
    "&msc SCRL_DOWN": Scroll ↓
    "&msc SCRL_LEFT": Scroll ←
    "&msc SCRL_RIGHT": Scroll →
  # Blank instead of a glyph - the previous version of this file had a
  # mojibake "??" here (an encoding accident from a prior edit), which
  # is exactly the kind of broken character this project doesn't want
  # showing up in the SVG. urob's own config does the same thing.
  trans_legend: { t: "", type: trans }
  # Shortens HRM hold-labels and a few other keycodes the same way
  # urob's config does (LALT/LCTRL/... -> Alt/Ctrl/...) - same
  # behaviors/params as theirs, copied as-is. Setting this field replaces
  # keymap-drawer's own default zmk_keycode_map wholesale rather than
  # merging with it (found the hard way: MINUS/EQUAL/ASTRK/DOT/etc. on
  # the NUM layer's calculator row rendered as raw keycode names instead
  # of symbols until this was fixed) - so the full default symbol map is
  # kept below and urob's short-name overrides for mods/nav/media keys
  # are added on top of it, not instead of it.
  zmk_keycode_map:
    LALT: Alt
    RALT: Alt
    LCTRL: Ctrl
    RCTRL: Ctrl
    LGUI: Gui
    RGUI: Gui
    LSHFT: Shift
    RSHFT: Shift
    BSPC: Bspc
    DEL: Del
    ESC: Esc
    RET: Enter
    SPACE: Spc
    TAB: Tab
    PG_UP: PgUp
    PG_DN: PgDn
    INS: Ins
    HOME: Home
    END: End
    UP: "↑"
    DOWN: "↓"
    LEFT: "←"
    RIGHT: "→"
    K_CANCEL: Cancel
    C_MUTE: Mute
    C_PP: Play
    C_VOL_UP: "Vol+"
    C_VOL_DN: "Vol-"
    C_NEXT: Next
    C_PREV: Prev
    # keymap-drawer's own defaults (dump-config), kept so plain symbol
    # keycodes still render as symbols instead of their raw names.
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: $
    DLLR: $
    PERCENT: "%"
    PRCNT: "%"
    CARET: ^
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: "="
    PLUS: +
    MINUS: "-"
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: \
    BSLH: \
    PIPE: "|"
    NON_US_BACKSLASH: \
    PIPE2: "|"
    NON_US_BSLH: "|"
    SEMICOLON: ;
    SEMI: ;
    COLON: ":"
    SINGLE_QUOTE: "'"
    SQT: "'"
    APOSTROPHE: "'"
    APOS: "'"
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ","
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET: "["
    LBKT: "["
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET: "]"
    RBKT: "]"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE: "`"
    TILDE: "~"
    NON_US_HASH: "#"
    NUHS: "#"
    TILDE2: "~"

draw_config:
  # Matches urob's own choices exactly - see draw/config.yaml in
  # urob/zmk-config. key_w/key_h/combo_w/combo_h/n_columns are left at
  # keymap-drawer's own defaults (60/56/28/26/1) rather than overridden,
  # same as urob's config leaves them.
  append_colon_to_layer_header: false
  dark_mode: false
  footer_text: "dh083064-ai/delta-omega-zmk"
  glyph_tap_size: 15
  glyph_hold_size: 12
  glyph_shifted_size: 10
  legend_rel_y: 1
  outer_pad_w: 10
  outer_pad_h: 10
  small_pad: 4
  # gruvbox palette + typography, adapted from urob's svg_style. Only
  # the parts that actually apply to a plain per-layer diagram (this
  # project only generates the equivalent of urob's base.svg, not the
  # separate combo-corner overview.svg) are kept - the .tl/.tr/.bl/.br
  # corner-label rules from the original are dropped since nothing here
  # emits those classes. The two momentary-layer thumbs that exist on
  # this board (Smart Num -> NUM at keypos-30, Enter -> NAV at
  # keypos-33) get the same per-thumb hold-label coloring treatment
  # urob applies to their own layer-access thumbs.
  svg_extra_style: |
    svg path { fill: inherit; }

    svg.keymap {
        --color-bg:      #7c6f64;
        --color-key:     #fbf1c7;
        --color-text:    #3c3836;
        --color-ghost:   #928374;
        --color-dendron: #d5c4a1;
        --color-held:    #bdae93;

        --color-nav:     #d79921;
        --color-num:     #d65d0e;

        fill: var(--color-text);
        background-color: var(--color-bg);
        font-family: Calibri, system-ui, sans-serif;
        font-size: 16px;
        font-kerning: normal;
        text-rendering: optimizeLegibility;
    }

    text {
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 0.02em;
    }

    text.tap     { font-weight: 500; }
    text.hold    { font-weight: 400; font-size: 13px; }
    text.shifted { font-weight: 400; font-size: 11px; }
    text.combo, text.left, text.right, text.tl, text.tr, text.bl, text.br { font-size: 10px; }

    text.hold, text.bl, text.br    { text-anchor: middle; dominant-baseline: auto; }
    text.shifted, text.tl, text.tr { text-anchor: middle; dominant-baseline: hanging; }
    text.left, text.tl, text.bl    { text-anchor: start; }
    text.right, text.tr, text.br   { text-anchor: end; }

    text.layer-activator { text-decoration: underline; }
    text.combo.hold, text.combo.shifted, text.combo.left, text.combo.right { font-size: 8px; }

    text.label, text.footer {
        fill: var(--color-key);
        stroke: var(--color-bg);
        stroke-width: 4;
        paint-order: stroke;
    }
    text.label  { font-weight: bold; text-anchor: start; }
    text.footer { text-anchor: end; dominant-baseline: auto; }

    rect.key, rect.combo, rect.combo-separate { fill: var(--color-key); stroke-width: 0; }
    rect.held, rect.combo.held                { fill: var(--color-held); }

    path.combo { stroke: var(--color-dendron); stroke-width: 2; stroke-dasharray: 2, 3; opacity: 0.45; fill: none; }

    .keypos-30 text.hold { fill: var(--color-num); }
    .keypos-33 text.hold { fill: var(--color-nav); }

    @media (prefers-color-scheme: dark) {
        svg.keymap {
            --color-bg:      #a89984;
            --color-key:     #282828;
            --color-text:    #ebdbb2;
            --color-ghost:   #928374;
            --color-dendron: #504945;
            --color-held:    #665c54;

            --color-nav:     #fabd2f;
            --color-num:     #d65d0e;
        }
    }
