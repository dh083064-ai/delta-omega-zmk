## Delta Omega - KOR / ENG / MAPLE configuration

## Root cause found: CONFIG_ZMK_USB was never explicitly enabled. On this
## newer ZMK it's an opt-in "Output Type" (select USB_DEVICE_HID) - unlike
## the old v0.3 pin where it was implicitly on. ZMK_USB_LOGGING alone only
## brings up USB+CDC-ACM (serial), not USB_DEVICE_HID, so the HID_0 device
## never got created (device_get_binding("HID_0") returned NULL) and every
## HID report silently no-op'd. This is what actually fixes typing.
CONFIG_ZMK_USB=y

## esb-no-dongle branch: the L<->R split link moves from BLE to ESB
## (badjeff/zmk-feature-split-esb). USB to the host (above) is untouched -
## only the split transport changes. This module cannot compile with BLE
## enabled at all, so it's off entirely (was CONFIG_ZMK_BLE=y on the
## BLE-split branch, needed there for the split link over BLE).
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

## ESB tuning - starting from the module's documented defaults; latency/
## retry tuning comes later once the link is confirmed stable.
CONFIG_ZMK_SPLIT_ESB_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
## The module's checksum option calls crc32_ieee() but doesn't `select CRC`
## itself (a real gap in its Kconfig, not just misconfiguration on our end -
## caused a linker error: "undefined reference to crc32_ieee"). Just CRC=y -
## CRC32_IEEE itself is a hw-driver-gated symbol we can't set directly; the
## software crc32_ieee() implementation is unconditional once CRC=y.
CONFIG_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_DELAY=600
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_RETRANSMIT_COUNT=3
## 1 session since BLE is off everywhere (would need 2 if a central also
## paired to the host over BLE, which ours doesn't - it's USB).
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

## Our own behavior_rapid_fire.c calls sys_rand32_get() for jittered
## timing - previously worked implicitly because Bluetooth pulled in an
## entropy driver. With BLE off entirely, nothing else provides one.
CONFIG_ENTROPY_GENERATOR=y

## Required by the module per its README.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=256
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=10
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024

## Diagnostic logging (confirmed harmless).
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

## LED Indicator
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_RGBLED_WIDGET=y

## zmk-rgbled-widget
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_LAYER_COLOR=4

## Power
## Deep sleep (sys_poweroff after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT) fully
## powers off the peripheral, and waking it back up requires a cold
## reboot + re-establishing the split BLE link from scratch - unreliable
## in practice (right half went unresponsive after long idle). Disabled;
## the 30s idle state below (LEDs off, no poweroff) still saves power.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

## HID - full N-key rollover (NKRO wasn't the problem - restoring it)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

## Mouse emulation
CONFIG_ZMK_POINTING=y

# Persistent per-layer RGB LED colors
# 0=Black, 1=Red, 2=Green, 3=Yellow, 4=Blue, 5=Magenta, 6=Cyan, 7=White
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=2
# Only 8 colors exist (3-bit RGB); Gaming/Mutil reuse Num/Sys's since they're
# rarely confused for each other in context.
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=5

# Key debounce - down to 1ms. Chatter tolerance for the one known-flaky
# switch (Space) is handled in software by space_ht instead, so the global
# hardware debounce can stay minimal for snappier feel everywhere else.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=1

# Space-only software debounce cooldown (testing 150ms)
CONFIG_ZMK_DEBOUNCE_TAP_COOLDOWN_MS=150
