## Delta Omega - KOR / ENG / MAPLE configuration

## Root cause found: CONFIG_ZMK_USB was never explicitly enabled. On this
## newer ZMK it's an opt-in "Output Type" (select USB_DEVICE_HID) - unlike
## the old v0.3 pin where it was implicitly on. ZMK_USB_LOGGING alone only
## brings up USB+CDC-ACM (serial), not USB_DEVICE_HID, so the HID_0 device
## never got created (device_get_binding("HID_0") returned NULL) and every
## HID report silently no-op'd. This is what actually fixes typing.
CONFIG_ZMK_USB=y

## Diagnostic logging (confirmed harmless).
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

## LED Indicator
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_RGBLED_WIDGET=y

## zmk-rgbled-widget
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_LAYER_COLOR=4

## Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

## HID - full N-key rollover (NKRO wasn't the problem - restoring it)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

## Mouse emulation
CONFIG_ZMK_POINTING=y

# Persistent per-layer RGB LED colors
# 0=Black, 1=Red, 2=Green, 3=Yellow, 4=Blue, 5=Magenta, 6=Cyan, 7=White
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=2

# Key debounce - back to stock default while diagnosing "no keys respond"
# on the urob-migration branch (ruling out a debounce/kscan-timing mismatch
# under the newer Zephyr kscan driver).
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Space-only software debounce cooldown (testing 150ms)
CONFIG_ZMK_DEBOUNCE_TAP_COOLDOWN_MS=150
