## Delta Omega - KOR / ENG / MAPLE configuration

## LED Indicator
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_RGBLED_WIDGET=y

## zmk-rgbled-widget
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_RGBLED_WIDGET_LAYER_COLOR=4

## Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

## HID - full N-key rollover (required so MAPLE can register many keys at once)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

## Low-latency tuning for the MAPLE game layer
## Matrix debounce: lower than the 5ms default shortens press/release detection time.
## If you ever see chatter/double-fires on MAPLE, raise these back toward 5.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

## BLE connection interval: request the fastest interval the host will grant
## (units of 1.25ms, so 6=7.5ms / 12=15ms) instead of the ~30-50ms default.
## Reduces input-to-host latency at the cost of higher power draw/battery life.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
