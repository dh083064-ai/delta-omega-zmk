## Delta Omega - KOR / ENG / MAPLE configuration

## Root cause found: CONFIG_ZMK_USB was never explicitly enabled. On this
## newer ZMK it's an opt-in "Output Type" (select USB_DEVICE_HID) - unlike
## the old v0.3 pin where it was implicitly on. ZMK_USB_LOGGING alone only
## brings up USB+CDC-ACM (serial), not USB_DEVICE_HID, so the HID_0 device
## never got created (device_get_binding("HID_0") returned NULL) and every
## HID report silently no-op'd. This is what actually fixes typing.
CONFIG_ZMK_USB=y

## esb-tdma-kumbung01 branch: L<->R split link over ESB with TDMA/FHSS
## scheduling (kumbung01/zmk-split-esb), not BLE. USB to the host (above)
## is untouched. This module also cannot compile with BLE enabled.
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y

## TDMA slot timing: each heartbeat cycle (fixed 1s) is divided into
## CONFIG_ESB_POLLING_RATE slots, cycled round-robin across
## CONFIG_ESB_PIPE_COUNT pipes - so a peripheral's real interval is
## 1,000,000us / rate / pipe_count, NOT just 1/rate. Pipe count DEFAULTS
## TO 8 regardless of how many peripherals actually exist, so leaving it
## unset would silently give an 8x-worse interval than intended (8ms
## instead of 1ms at 1kHz) - traced this by reading subsys/esb/esb.c
## directly, it's not mentioned in the module's own README.
CONFIG_ESB_PIPE_COUNT=1
CONFIG_ESB_POLLING_RATE_2KHZ=y

## Our own behavior_rapid_fire.c calls sys_rand32_get(); this module's
## own Kconfig already selects ENTROPY_GENERATOR/ENTROPY_NRF5_RNG when
## ESB is on, but setting it explicitly costs nothing.
CONFIG_ENTROPY_GENERATOR=y

## peripheral.c's battery_report_work_handler calls
## zmk_battery_state_of_charge() unconditionally - linker error
## (undefined reference) without this on.
CONFIG_ZMK_BATTERY_REPORTING=y

## TEMPORARY debug build: logging on for physical hold-duration
## measurement over serial. (CONFIG_ZMK_LOG_LEVEL isn't directly settable -
## it's derived, not a plain int Kconfig - so the "zmk" module still logs
## at DBG regardless of LOG_DEFAULT_LEVEL below; filter with grep "rf:"
## when reading the capture instead.) Revert before flashing as the daily
## driver again - see the release commit right after this.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG=n
CONFIG_LOG=n

## LED Indicator
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_RGBLED_WIDGET=y

## zmk-rgbled-widget
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_LAYER_COLOR=4

## Power
## Deep sleep (sys_poweroff after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT) fully
## powers off the peripheral, and waking it back up requires a cold
## reboot + re-establishing the split BLE link from scratch - unreliable
## in practice (right half went unresponsive after long idle). Disabled;
## the 30s idle state below (LEDs off, no poweroff) still saves power.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

## HID - full N-key rollover (NKRO wasn't the problem - restoring it)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

## Mouse emulation
CONFIG_ZMK_POINTING=y

# Persistent per-layer RGB LED colors
# 0=Black, 1=Red, 2=Green, 3=Yellow, 4=Blue, 5=Magenta, 6=Cyan, 7=White
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=7
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_6_COLOR=2
# Only 8 colors exist (3-bit RGB); Gaming/Mutil reuse Num/Sys's since they're
# rarely confused for each other in context.
CONFIG_RGBLED_WIDGET_LAYER_7_COLOR=1
CONFIG_RGBLED_WIDGET_LAYER_8_COLOR=5

# Key debounce - asymmetric. Press stays at 1ms since that's the latency
# that actually matters for gameplay. Release is 5ms (was 1ms): a release
# bounce doesn't cost reaction time, but it does feed spurious press/release
# pairs into stateful behaviors that key off physical edges - rapid-fire's
# hold tracking, the Cleanse alternator, hold-taps, Ctrl/Esc - so it's worth
# a little more margin than press. Space's own chatter tolerance is still
# handled separately by space_ht.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Space-only software debounce cooldown (testing 150ms)
CONFIG_ZMK_DEBOUNCE_TAP_COOLDOWN_MS=150
