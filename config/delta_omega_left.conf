## This fork's Kconfig defines CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS as
## an "int" prompt with NO default at all, in exactly our condition
## (ZMK_SPLIT && !ZMK_SPLIT_BLE && ZMK_SPLIT_ROLE_CENTRAL) - the same gap
## found in badjeff's original fork (it's a straight copy of that Kconfig
## block). Left unset it was the trigger for a "missing expression"
## assembler failure there; setting it explicitly avoids the same risk
## here.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
