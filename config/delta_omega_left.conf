## This fork's Kconfig defines CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS as
## an "int" prompt with NO default at all, in exactly our condition
## (ZMK_SPLIT && !ZMK_SPLIT_BLE && ZMK_SPLIT_ROLE_CENTRAL) - the same gap
## found in badjeff's original fork (it's a straight copy of that Kconfig
## block). Left unset it was the trigger for a "missing expression"
## assembler failure there; setting it explicitly avoids the same risk
## here.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1

## --- SmartNum timing diagnostic (temporary, this branch only) ---
## Re-enables the USB CDC-ACM logging backend that delta_omega.conf turns
## off for the daily-driver gaming build (see its "Gaming/release variant"
## comment) - central-only, since all hold-tap/keymap/layer decisions run
## on this shield; the peripheral (delta_omega_right) never sees them and
## doesn't need this override. Revert (delete this branch) once the
## SmartNum resolve-timing question is answered - not meant to ship.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y

## Ring buffer/log buffer defaults (1024/8192, from zmk's own app/Kconfig)
## were too small during a heavy typing burst - many log lines were
## silently dropped. Bumped for this diagnostic branch only.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
CONFIG_LOG_BUFFER_SIZE=16384
