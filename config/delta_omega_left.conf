## ESB central-side: must be >= the highest peripheral id in use (right=1).
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=1

## The module's Kconfig defines this (ZMK_SPLIT && !ZMK_SPLIT_BLE &&
## ZMK_SPLIT_ROLE_CENTRAL - exactly our case) as an "int" prompt with NO
## default value at all. Left unset, that's a likely culprit for the
## "missing expression" assembler failure in misc/generated/configs.c
## (which embeds every Kconfig int as an absolute asm symbol - an
## undefined/empty one breaks the generated expression). Setting it
## explicitly removes the ambiguity regardless of how Kconfig would
## otherwise have resolved it.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=1
