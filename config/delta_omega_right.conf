## ESB peripheral source id - 0-indexed. Central's ENABLED_PIPES is
## GENMASK(PERIPHERAL_COUNT-1, 0), so with PERIPHERAL_COUNT=1 on the
## central only pipe 0 is enabled. This must be 0 (not 1) for our single
## peripheral to land on the pipe the central is actually listening on -
## confirmed by reading app_esb.c's ENABLED_PIPES macros directly (right
## side was completely silent with this set to 1).
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=0
