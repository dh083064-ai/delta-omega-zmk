description: >
  Backspace special: tap = one Bspc, hold (cold or after a tap) = Bspc
  held down (OS repeat), tap-then-tap = Caps Word.

compatible: "zmk,behavior-bspc-special"

include: zero_param.yaml

properties:
  bindings:
    type: phandles
    required: true
    description: Single entry, the behavior invoked for the tap-then-tap case (Caps Word).
