description: G roll-aware grace - press emits HID down immediately. While physically held, a LEFT/RIGHT press is only noted (direction_seen), G stays down. On physical release, if a direction was already seen during the hold, HID up fires immediately (release_reason=direction_before_release). Otherwise a short grace window (CONFIG_ZMK_G_ROLL_GRACE_MS) starts: a direction press during grace ends it immediately (direction_after_release), otherwise the grace timing out ends it (timeout). No repeat/rapid-fire edges - one press, one (possibly grace-delayed) release per physical session.

compatible: "zmk,behavior-g-roll-grace"

include: one_param.yaml
